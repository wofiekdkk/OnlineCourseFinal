<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ course.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container"><a class="navbar-brand" href="{% url 'course_list' %}">OnlineCourse</a></div>
</nav>
<main class="container py-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="h2">{{ course.name }}</h1>
      <p>{{ course.description }}</p>
      <h2 class="h4 mt-4">Course lessons</h2>
      {% for lesson in lessons %}
        <div class="border rounded p-3 mb-3 bg-white">
          <h3 class="h5">{{ lesson.order }}. {{ lesson.title }}</h3>
          <p class="mb-0">{{ lesson.content }}</p>
        </div>
      {% empty %}
        <p>No lessons have been added yet.</p>
      {% endfor %}
      <a class="btn btn-primary" href="{% url 'mock_exam' course.id %}">Take mock exam</a>
    </div>
  </div>
</main>
</body>
</html>
